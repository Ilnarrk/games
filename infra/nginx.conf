map $http_x_forwarded_proto $game_proto {
    default $scheme;
    https https;
}
map $http_upgrade $game_connection {
    default upgrade;
    '' close;
}
server {
    listen 80;
    client_max_body_size 1k;
    # Node serves the catalog, game assets and APIs from one routing table.
    location ~ ^/game(?:/|$) {
        proxy_pass http://game-server:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $game_connection;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $game_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }
}
